name: Staging verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Tests, security, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:security
      - run: npm run test:campaign-mock
      - run: npm run test:line-login
      - run: npm run typecheck
      - run: npm run build

  postgres-line-login:
    name: Disposable PostgreSQL LINE Login integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: line_ccc
          POSTGRES_PASSWORD: line_ccc_ci_password
          POSTGRES_DB: line_ccc_line_login_qa_ci
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U line_ccc -d line_campaign_ccc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LINE_LOGIN_TEST_DATABASE_URL: postgres://line_ccc:line_ccc_ci_password@127.0.0.1:55433/line_ccc_line_login_qa_ci
      APP_MODE: DRY_RUN
      LINE_LIVE_ENABLED: 'false'
      LINE_WEBHOOK_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:line-login:postgres
