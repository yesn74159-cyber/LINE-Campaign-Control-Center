# Edge rules for the Admin static surface. The API stays on the private Docker
# network; this container only proxies /api and /health to it.
limit_req_zone $binary_remote_addr zone=api_rate:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  location /api/ {
    limit_req zone=api_rate burst=30 nodelay;
    limit_conn api_conn 20;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_pass http://api:8787;
  }

  location = /health {
    access_log off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://api:8787/health;
  }

  location /assets/ {
    expires 7d;
    try_files $uri =404;
  }

  location = /sw.js {
    expires -1;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    expires -1;
    try_files $uri =404;
  }

  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }

  location ~ /\. {
    deny all;
  }
}
