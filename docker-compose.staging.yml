services:
  postgres:
    image: postgres:16-alpine
    container_name: line-ccc-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-line_ccc}
      # Required for the existing local volume; no password fallback is stored in the repository.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set_POSTGRES_PASSWORD_for_the_existing_local_staging_volume}
      POSTGRES_DB: ${POSTGRES_DB:-line_campaign_ccc}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - line-ccc-postgres-staging:/var/lib/postgresql/data
volumes:
  line-ccc-postgres-staging:
